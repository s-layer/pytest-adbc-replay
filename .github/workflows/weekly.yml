
name: Weekly compatibility check

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:
concurrency:
  group: weekly-compat
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  compat:
    name: Latest deps compatibility
    runs-on: ubuntu-latest
    # Quality, unit tests and the integration run (dbc install, MySQL container)
    # together: _test.yml gives those 15 + 20 minutes in two jobs. A job-level
    # timeout skips the failure-PR steps, so leave headroom.
    timeout-minutes: 35
    env:
      HAS_APP: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.11"

      - name: Sync latest compatible dependencies
        run: uv sync --upgrade --dev

      - name: Install prek
        run: uv tool install prek

      - name: Run quality gates
        id: quality
        continue-on-error: true
        run: prek run --all-files

      # The same split as _test.yml: unit tests here, integration tests (which need
      # Docker, the dbc CLI and its MySQL driver) in the steps below.
      - name: Tests
        id: tests
        continue-on-error: true
        run: uv run pytest tests/unit/

      - name: Sync latest integration dependencies
        id: integration-sync
        continue-on-error: true
        run: uv sync --upgrade --group dev --group integration

      - name: Install dbc CLI and MySQL Foundry driver
        id: dbc
        if: steps.integration-sync.outcome == 'success'
        continue-on-error: true
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          dbc --version
          dbc install mysql

      - name: Integration tests
        id: integration
        if: steps.dbc.outcome == 'success'
        continue-on-error: true
        run: uv run pytest tests/integration/ -v

      - name: Cache pruning
        if: always()
        run: uv cache prune --ci

      - name: Get app token
        id: app-token
        if: (steps.quality.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.integration-sync.outcome == 'failure' || steps.dbc.outcome == 'failure' || steps.integration.outcome == 'failure') && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Open PR for @copilot to fix
        if: steps.quality.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.integration-sync.outcome == 'failure' || steps.dbc.outcome == 'failure' || steps.integration.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deps/weekly-compat-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore: update uv.lock for weekly compatibility check"
          fi
          git push --force origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: weekly dependency compatibility failure ($(date +%Y-%m-%d))" \
            --body "## Weekly compatibility check failed

          The scheduled [weekly compatibility run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) found that the latest compatible dependency versions break this project.

          @copilot please investigate the CI failures and fix any incompatibilities — check for breaking changes in recently released dependency versions.

          **Failed run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "PR already exists for branch $BRANCH, skipping creation"
